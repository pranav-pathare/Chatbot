:root {
  --background: 0 0% 100%;
  --foreground: 262 35% 14%;
  --card: 0 0% 100%;
  --card-foreground: 262 35% 14%;
  --primary: 266 78% 54%;
  --primary-foreground: 0 0% 100%;
  --secondary: 266 40% 96%;
  --secondary-foreground: 262 30% 24%;
  --muted: 266 30% 97%;
  --muted-foreground: 262 10% 42%;
  --accent: 267 100% 97%;
  --accent-foreground: 266 66% 42%;
  --destructive: 0 72% 51%;
  --destructive-foreground: 0 0% 100%;
  --border: 266 26% 90%;
  --input: 266 22% 85%;
  --ring: 266 78% 54%;
  --radius: 0.625rem;
  --sidebar: 270 60% 99%;
  --sidebar-foreground: 262 14% 34%;
  --sidebar-muted: 268 60% 96.5%;
  --sidebar-border: 266 32% 91%;
  --sidebar-accent: 266 78% 54%;
  --sidebar-active: 267 90% 94.5%;
  --sidebar-strong: 262 40% 14%;
}
.dark {
  --background: 265 34% 8%;
  --foreground: 265 25% 95%;
  --card: 265 30% 11%;
  --card-foreground: 265 25% 95%;
  --primary: 266 86% 69%;
  --primary-foreground: 265 40% 8%;
  --secondary: 265 25% 16%;
  --secondary-foreground: 265 25% 90%;
  --muted: 265 25% 14%;
  --muted-foreground: 265 12% 66%;
  --accent: 266 38% 21%;
  --accent-foreground: 266 90% 90%;
  --destructive: 0 70% 56%;
  --destructive-foreground: 0 0% 100%;
  --border: 265 22% 19%;
  --input: 265 22% 24%;
  --ring: 266 86% 69%;
  --sidebar: 266 38% 7%;
  --sidebar-foreground: 265 18% 76%;
  --sidebar-muted: 266 30% 12%;
  --sidebar-border: 266 26% 17%;
  --sidebar-accent: 266 90% 76%;
  --sidebar-active: 267 42% 21%;
  --sidebar-strong: 0 0% 100%;
}
@layer base {
  * {
    border-color: var(--color-border);
  }
  html, body, #root {
    height: 100%;
  }
  body {
    background-color: var(--color-background);
    color: var(--color-foreground);
    -webkit-font-smoothing: antialiased;
    font-family: var(--font-sans);
    font-feature-settings: "cv11", "ss01";
  }
  ::selection {
    background: hsl(var(--primary) / 0.25);
  }
  button:not(:disabled), [role="button"]:not(:disabled) {
    cursor: pointer;
  }
}
@keyframes vm-fade-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes vm-slide-right {
  from {
    transform: translateX(32px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}
@keyframes vm-slide-left {
  from {
    transform: translateX(-32px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}
@keyframes vm-pop {
  from {
    opacity: 0;
    transform: scale(0.97);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes vm-dot {
  0%, 80%, 100% {
    opacity: 0.25;
    transform: translateY(0);
  }
  40% {
    opacity: 1;
    transform: translateY(-3px);
  }
}
.vm-fade-in {
  animation: vm-fade-in 0.28s ease-out both;
}
.vm-pop {
  animation: vm-pop 0.18s ease-out both;
}
.vm-slide-right {
  animation: vm-slide-right 0.22s ease-out both;
}
.vm-slide-left {
  animation: vm-slide-left 0.22s ease-out both;
}
.vm-dot {
  animation: vm-dot 1.1s infinite ease-in-out;
}
.vm-scroll {
  scrollbar-width: thin;
  scrollbar-color: hsl(var(--border)) transparent;
}
.vm-scroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.vm-scroll::-webkit-scrollbar-thumb {
  background: hsl(var(--border));
  border-radius: 999px;
}
.vm-no-scrollbar {
  scrollbar-width: none;
}
.vm-no-scrollbar::-webkit-scrollbar {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  .vm-fade-in, .vm-pop, .vm-dot, .vm-slide-right, .vm-slide-left {
    animation: none;
  }
}

tags:["leave","holiday","vacation","sick","pto","time off","carry over"],sections:[{id:"entitlements",heading:"Entitlements",body:["Full-time employees receive 24 days of paid annual leave per calendar year, in addition to public holidays.","Sick leave is 10 days per year. A medical note is required after 3 consecutive days of absence.","Up to 5 unused annual leave days can be carried over and must be used by 31 March."]},{id:"requesting-leave",heading:"Requesting leave",body:["Leave is requested through the HR portal and approved by your line manager."],steps:["Check your remaining balance in the HR portal under My Leave.","Submit a request at least 10 working days ahead for any absence longer than 3 days.","Add a handover note and name a backup for each client account you manage.","Wait for your manager's approval. You will receive a confirmation email.","For sick leave, tell your manager before 10:00 on the first day of absence."]}]},{id:"hybrid-policy",title:"Remote & Hybrid Work Policy",type:"Policy",category:"HR",summary:"Office attendance expectations, anchor days and rules for working from another location.",owner:"People Operations",version:"2.1",updatedAt:"2026-07-02",readMins:4,tags:["remote","wfh","hybrid","work from home","office","anchor days"],sections:[{id:"hybrid-schedule",heading:"Hybrid schedule",body:["Teams work from the office at least 2 days per week. Tuesday and Thursday are anchor days for all teams.","Fully remote arrangements need written approval from a department head and are reviewed every 6 months."]},{id:"other-location",heading:"Working from another city or country",body:["Temporary work from another location is allowed for up to 4 weeks per year."],steps:["Ask your manager for approval at least 15 working days before you travel.","Confirm tax and legal clearance with Finance and Legal for any international stay.","Use the company VPN and an encrypted company laptop for the whole stay."]}]},{id:"onboarding-checklist",title:"Employee Onboarding Checklist",type:"SOP",category:"HR",summary:"What People Ops, IT and the hiring manager complete before and during a new hire's first two weeks.",owner:"People Operations",version:"1.8",updatedAt:"2026-08-21",readMins:6,tags:["onboarding","new hire","joiner","first week","induction"],sections:[{id:"before-day-one",heading:"Before day one",body:["Complete these steps at least 5 working days before the start date."],steps:["People Ops sends the signed contract and collects ID and bank details.","IT orders the laptop and creates accounts for email, Slack and project tools.","The hiring manager prepares a 30-day plan and assigns an onboarding buddy."]},{id:"first-week",heading:"First week",body:["The new hire is not expected to deliver client work during week one."],steps:["Welcome session with People Ops and a tour of internal tools.","Complete security awareness training and sign the confidentiality agreement.","Meet each team lead and shadow one client call.","Hold a 30-minute check-in with the manager at the end of the week."]}]},{id:"expense-sop",title:"Expense Reimbursement Process",type:"SOP",category:"Finance",summary:"Which expenses are eligible, receipt rules, approval limits and reimbursement timelines.",owner:"Finance",version:"4.0",updatedAt:"2026-10-05",readMins:5,tags:["expense","reimbursement","claim","receipt","travel","refund"],sections:[{id:"eligible-expenses",heading:"Eligible expenses",body:["Client travel, accommodation, meals while travelling and approved software are reimbursable.","Alcohol, personal travel upgrades and fines are not reimbursable.","Any single expense above $500 needs approval from your department head before you spend."]},{id:"submitting-a-claim",heading:"Submitting a claim",body:["Claims must be submitted within 30 days of the expense date."],steps:["Collect an itemised receipt for every expense above $25.","Fill in the Expense Claim Form and select the correct client or project code.","Attach the receipts and submit the form in the Finance portal.","Your manager approves the claim within 3 working days.","Finance pays approved claims in the next Friday payroll run."]}]},{id:"expense-form",title:"Expense Claim Form",type:"Template",category:"Finance",summary:"Standard form for submitting expense claims with project codes and receipt references.",owner:"Finance",version:"2.3",updatedAt:"2026-09-30",readMins:2,tags:["expense","form","claim","template","receipt"],sections:[{id:"form-fields",heading:"Fields to complete",body:["Employee name, department and manager.","Date, description, amount and currency for each line item.","Client or project code and cost centre.","Receipt reference number for every line above $25.","Employee signature and date."]}]},{id:"invoicing-sop",title:"Client Invoicing & Payment Terms",type:"SOP",category:"Finance",summary:"How to raise, send and chase client invoices, including standard payment terms.",owner:"Finance",version:"3.1",updatedAt:"2026-08-11",readMins:5,tags:["invoice","billing","payment","terms","client","overdue"],sections:[{id:"payment-terms",heading:"Standard payment terms",body:["Standard terms are net 30 days from the invoice date.","Retainer clients are invoiced on the 1st of each month in advance.","A late fee of 1.5% per month applies to overdue invoices where the contract allows it."]},{id:"raising-an-invoice",heading:"Raising an invoice",body:["Invoices are raised by the account manager and issued by Finance."],steps:["Confirm the milestone or retainer period is complete in the project tracker.","Submit an invoice request in the Finance portal with the PO number and billing contact.","Finance issues the invoice within 2 working days.","Follow up on invoices that are 7 days overdue and escalate to Finance at 14 days."]}]},{id:"brand-guidelines",title:"Accel Brand Guidelines",type:"Guide",category:"Marketing",summary:"Logo usage, colour palette, typography and tone of voice for all internal and client-facing material.",owner:"Brand Team",version:"5.0",updatedAt:"2026-06-18",readMins:8,tags:["brand","logo","colour","color","typography","tone","voice","identity"],sections:[{id:"logo-usage",heading:"Logo usage",body:["Keep clear space around the logo equal to the height of the letter V on every side.","Never stretch, recolour, rotate or add effects to the logo.","Use the white logo on dark backgrounds and the full-colour logo on white or light grey.","The minimum logo width is 24 mm in print and 96 px on screen."]},{id:"colour-and-type",heading:"Colour and typography",body:["The primary palette is white and purple, with deep plum for text and light lavender as a support colour.","Use the approved sans-serif family for headings and body text in presentations and documents."]},{id:"tone-of-voice",heading:"Tone of voice",body:["Write in a clear, confident and warm voice. Prefer short sentences and plain words.","Avoid jargon and unexplained acronyms in client-facing material."]}]},{id:"content-calendar",title:"Social Media Content Calendar",type:"Template",category:"Marketing",summary:"Monthly planning sheet for posts, channels, owners, approval status and publish dates.",owner:"Social Team",version:"1.6",updatedAt:"2026-09-02",readMins:3,tags:["social","content","calendar","template","posts","planning"],sections:[{id:"calendar-columns",heading:"Columns in the template",body:["Publish date and time, channel and format (image, video, carousel, story).","Campaign, caption, asset link and hashtags.","Owner, reviewer and approval status (draft, in review, approved, published)."]},{id:"calendar-workflow",heading:"Monthly workflow",body:["Plan one month ahead."],steps:["Copy the template and name it with the client and month.","Fill in key dates and campaign themes in the first planning session.","Move each post to in review at least 3 working days before publishing.","Mark posts as published and record the post link for reporting."]}]},{id:"campaign-brief",title:"Campaign Brief Template",type:"Template",category:"Marketing",summary:"One-page brief covering objective, audience, key message, channels, budget and success metrics.",owner:"Strategy Team",version:"2.0",updatedAt:"2026-08-27",readMins:3,tags:["campaign","brief","template","strategy","objective","audience"],sections:[{id:"brief-sections",heading:"What the brief must include",body:["Background and business objective in two or three sentences.","Target audience, including who is not the audience.","Single key message and supporting proof points.","Channels, timeline, budget and approval owners.","Success metrics with baseline and target values."]},{id:"brief-process",heading:"Using the brief",body:["The brief is signed off before any creative work starts."],steps:["The account lead drafts the brief with the client after the kickoff call.","Strategy reviews it for a clear objective and measurable targets.","The client signs it off by email, and it is saved in the project folder."]}]},{id:"client-onboarding",title:"Client Onboarding SOP",type:"SOP",category:"Operations",summary:"Steps from signed contract to first deliverable for a new client account.",owner:"Operations",version:"2.5",updatedAt:"2026-09-19",readMins:6,tags:["client","onboarding","new account","kickoff","contract","setup"],sections:[{id:"onboarding-steps",heading:"Onboarding steps",body:["Operations owns the process and the account manager runs the client communication."],steps:["Confirm the signed contract and Statement of Work are saved in the client folder.","Create the client workspace, project tracker and shared channel.","Send the welcome pack and request brand assets, logins and key contacts.","Hold the kickoff call within 5 working days of signature.","Share the 30-day plan and confirm the reporting schedule."]},{id:"onboarding-checks",heading:"Checks before the first deliverable",body:["Billing contact and PO number are recorded with Finance.","Approval owners on the client side are named in writing."]}]},{id:"project-kickoff",title:"Project Kickoff & Handover Process",type:"SOP",category:"Operations",summary:"How to run a project kickoff and hand work between teams without losing context.",owner:"Operations",version:"1.9",updatedAt:"2026-07-24",readMins:4,tags:["kickoff","handover","project","handoff","meeting"],sections:[{id:"kickoff-agenda",heading:"Kickoff agenda",body:["Keep the kickoff to 60 minutes."],steps:["Review the objective, scope and success metrics from the brief.","Confirm roles, approval owners and the communication plan.","Walk through the timeline and the main risks.","Record decisions and actions, and send notes within 24 hours."]},{id:"handover",heading:"Handover between teams",body:["Use a written handover note with status, open issues, file locations and next steps.","The outgoing owner stays available for questions for 5 working days."]}]},{id:"security-policy",title:"Password & Access Security Policy",type:"Policy",category:"IT & Security",summary:"Password rules, multi-factor authentication, device security and reporting incidents.",owner:"IT Security",version:"3.0",updatedAt:"2026-10-12",readMins:4,tags:["password","security","mfa","access","2fa","incident","vpn"],sections:[{id:"password-rules",heading:"Password and MFA rules",body:["Passwords must be at least 14 characters and unique to each account.","Use the company password manager. Never share passwords in chat or email.","Multi-factor authentication is mandatory for email, VPN and all client systems."]},{id:"report-incident",heading:"Reporting a security incident",body:["Report suspected phishing, lost devices or unusual access straight away."],steps:["Disconnect the affected device from the network if you think it is compromised.","Message the IT Security channel or email the security mailbox with what happened.","Do not delete anything. IT Security will advise on next steps."]}]},{id:"it-equipment",title:"IT Equipment Request SOP",type:"SOP",category:"IT & Security",summary:"How to request, replace or return laptops, monitors and accessories.",owner:"IT Support",version:"1.4",updatedAt:"2026-08-05",readMins:3,tags:["laptop","equipment","hardware","monitor","it","request","replacement"],sections:[{id:"request-equipment",heading:"Requesting equipment",body:["Standard requests are fulfilled within 5 working days."],steps:["Open a ticket in the IT Help Desk and choose Hardware Request.","State what you need and why, and add your manager as approver.","IT confirms stock and delivery date once the manager approves.","Collect or receive the item and sign the asset log."]},{id:"return-equipment",heading:"Returns and replacements",body:["Faulty devices are replaced on a one-for-one basis after IT diagnosis.","Leavers return all equipment on or before their last working day."]}]},{id:"sow-template",title:"Statement of Work Template",type:"Template",category:"Legal",summary:"Standard SOW structure with scope, deliverables, timeline, fees and change control.",owner:"Legal",version:"3.4",updatedAt:"2026-09-08",readMins:4,tags:["sow","statement of work","contract","scope","template","deliverables"],sections:[{id:"sow-structure",heading:"Structure",body:["Parties, effective date and reference to the master agreement.","Scope of work and a numbered list of deliverables with acceptance criteria.","Timeline and milestones, fees and payment schedule.","Change control procedure and assumptions.","Signature block for both parties."]},{id:"sow-usage",heading:"Using the template",body:["Legal must review any change to the fees, liability or intellectual property clauses."],steps:["Copy the latest template from this library. Do not reuse an old SOW.","Complete the scope, deliverables and fees with the account lead.","Send to Legal for review if you changed any protected clause.","Issue to the client for signature and file the signed copy in the client folder."]}]},{id:"nda-guidelines",title:"NDA & Confidentiality Guidelines",type:"Policy",category:"Legal",summary:"When an NDA is required, who can
